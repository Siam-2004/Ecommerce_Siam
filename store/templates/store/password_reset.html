<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড ভুলে গেছেন? - Premium Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #090d16; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); max-width: 450px; width: 100%; text-align: center; }

        .icon-box { width: 80px; height: 80px; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 35px; color: #3b82f6; margin: 0 auto 20px; }
        h2 { font-size: 24px; margin-bottom: 10px; color: #f8fafc; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 30px; line-height: 1.5; }

        .input-group { text-align: left; margin-bottom: 25px; }
        .input-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 500; }
        .input-group input { width: 100%; padding: 14px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }

        .btn-submit { width: 100%; padding: 14px; background: #3b82f6; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-submit:hover { background: #2563eb; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); transform: translateY(-2px); }

        .back-link { display: inline-block; margin-top: 25px; color: #94a3b8; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="icon-box">
            <i class="fa-solid fa-unlock-keyhole"></i>
        </div>
        <h2>পাসওয়ার্ড ভুলে গেছেন?</h2>
        <p>চিন্তার কিছু নেই! আপনার অ্যাকাউন্টের ইমেইল অ্যাড্রেসটি নিচে দিন। আমরা পাসওয়ার্ড রিসেট করার একটি লিংক পাঠিয়ে দেবো।</p>

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>আপনার ইমেইল অ্যাড্রেস</label>
                <!-- Django's default password reset requires the input name to be "email" -->
                <input type="email" name="email" required placeholder="example@gmail.com">
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-paper-plane"></i> রিসেট লিংক পাঠান
            </button>
        </form>

        <a href="{% url 'login' %}" class="back-link"><i class="fa-solid fa-arrow-left"></i> লগইন পেজে ফিরে যান</a>
    </div>

</body>
</html>
