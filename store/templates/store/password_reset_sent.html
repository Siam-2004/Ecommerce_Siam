<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইমেইল পাঠানো হয়েছে - Premium Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #090d16; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); max-width: 450px; width: 100%; text-align: center; }

        .icon-box { width: 80px; height: 80px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 35px; color: #22c55e; margin: 0 auto 20px; }
        h2 { font-size: 24px; margin-bottom: 10px; color: #f8fafc; }
        p { font-size: 15px; color: #94a3b8; margin-bottom: 30px; line-height: 1.6; }

        .btn-home { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 12px 25px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .btn-home:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="icon-box">
            <i class="fa-solid fa-envelope-circle-check"></i>
        </div>
        <h2>ইমেইল পাঠানো হয়েছে!</h2>
        <p>আমরা আপনার ইমেইল অ্যাড্রেসে পাসওয়ার্ড রিসেট করার একটি লিংক পাঠিয়েছি। অনুগ্রহ করে আপনার ইনবক্স (এবং স্প্যাম ফোল্ডার) চেক করুন।</p>

        <a href="{% url 'login' %}" class="btn-home"><i class="fa-solid fa-arrow-left"></i> লগইন পেজে ফিরে যান</a>
    </div>

</body>
</html>
